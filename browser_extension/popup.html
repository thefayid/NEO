<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #18191c;
      color: #f1f2f6;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
    }
    .status-dot.connected {
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .badge {
      font-size: 11px;
      color: #9ca3af;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .btn {
      width: 100%;
      padding: 8px 12px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #2563eb; }
  </style>
</head>
<body>
  <div class="header">
    <div id="dot" class="status-dot"></div>
    <div class="title">NEO Companion</div>
  </div>
  <div id="status-text" class="badge">Connecting to NEO Desktop Assistant...</div>
  <button id="reconnect-btn" class="btn">Reconnect to NEO</button>
  <script src="popup.js"></script>
</body>
</html>
